# Reglas y lógica de decisión (Rules & Decision Logic).
# Edite este archivo para cambiar el comportamiento sin tocar el código.
# Cualquier clave que falte usa el valor por defecto de leadflow/rules.py.
# Reinicie el servicio después de cambiarlo.

# 1 · Prospección: qué leads de Propwire se aceptan
prospecting:
  required_fields: [owner_name, property_address]   # nombre del dueño y dirección
  require_phone: true      # descartar leads sin teléfono válido
  max_phones: 3            # Phone (1-3)
  property_types: []       # vacío = todos. Ej: [single_family, condo, townhouse, multi_family]
  skip_company_owners: false   # true = descartar dueños que son bancos o empresas
  skip_dnc_phones: true        # no usar teléfonos marcados "dnc" (Registro No Llamar) y recordarlos
  skip_litigators: true        # descartar personas marcadas "tcpa" (litigantes conocidos)
  enrich: true             # enriquecer con BeenVerified si está configurado

# Cómo se importa cada lead a Lofty
lofty:
  source: Propwire             # Lofty solo guarda fuentes de su propia lista; si no existe queda "Other"
  tags: [Propwire]             # la etiqueta sí se guarda siempre
  pond_name: null
  pond_id: null                # sin pond: cada lead se asigna a la persona de abajo
  # Tipo de lead: 1 = Seller (verificado en su cuenta).
  lead_types: [1]
  # Nivel de propiedad del lead (Level). La cuenta conectada en Zapier solo ofrece Personal.
  ownership_scope: null        # PERSONAL | TEAM | COMPANY
  call_and_text: true          # Call & Text: Yes
  assigned_user_id: 844771049678252   # Mark Rubio-Novack (ID de usuario en Lofty)

# 2 · Contacto
contact:
  default_mode: sms        # sms (masivo) o call (uno por uno, va a la lista de llamadas)
  batch_limit: 100         # máximo de mensajes iniciales por corrida
  require_mobile: true     # solo enviar SMS a celulares
  quiet_hours:             # solo se envían SMS dentro de este horario (hora local)
    start: "09:00"
    end: "20:00"
    timezone: America/Los_Angeles
  opt_out_keywords: [STOP, STOPALL, UNSUBSCRIBE, CANCEL, END, QUIT, OPTOUT, "OPT OUT",
                     REVOKE, ALTO, PARAR, PARE, BAJA, "NO MAS"]

# Clasificación de respuestas con Claude
classification:
  min_confidence: 0.6      # menos de esto = revisión manual
  auto_reply: false        # true = enviar la respuesta sugerida por Claude automáticamente
  auto_reply_categories: [question]

# Qué hacer con cada categoría de respuesta.
# status: hot | warm | follow_up | not_interested | dnc | unchanged
# next:   cma | notify_agent | review | schedule | schedule_long | next_phone | stop | none
actions:
  interested_selling: {status: hot, tags: [Seller Interested], next: cma}
  interested_buying:  {status: hot, tags: [Buyer Interested], next: notify_agent}
  question:           {status: warm, tags: [Question], next: review}
  future_follow_up:   {status: follow_up, tags: [Future Follow-up], next: schedule}
  not_interested:     {status: not_interested, tags: [Not Interested], next: schedule_long}
  wrong_number:       {status: unchanged, tags: [Wrong Number], next: next_phone}
  unclear:            {status: unchanged, tags: [], next: review}
  opt_out:            {status: dnc, tags: [DNC], next: stop}

# Tiempos de seguimiento
follow_up:
  future_default_months: 6     # "más adelante" sin fecha = 6 meses
  not_interested_months: 12    # "no me interesa" = volver a escribir en 1 año (0 = nunca)
  max_months: 24
  send_hour: 10                # hora local para seguimientos con fecha específica

# 3 · CMA para leads calientes
cma:
  auto_run: true           # crear el CMA en cuanto alguien responde que quiere vender
  lofty_api: false         # su cuenta de Lofty no tiene API de CMA: llega una alerta con un link
                           # para pegar el CMA hecho a mano, y el sistema lo envía por SMS
  radius_miles: 5
  max_cost: 0              # costo 0 (si está disponible)
  min_comps: 3             # validar resultados: mínimo de comparables
  eligible_statuses: [hot, warm]
  sellers_only: true
  language: null           # "es" = solo leads en español (Tag Spanish: ES)
  follow_up_days: 3        # llamar N días después de enviar el CMA

# Programador interno (se activa con SCHEDULER_ENABLED=true). Horas locales.
scheduler:
  jobs_every_minutes: 15           # seguimientos, CMAs y reintentos
  campaign_enabled: true           # mensajes iniciales automáticos
  campaign_time: "10:00"
  campaign_days: [mon, tue, wed, thu, fri]
  campaign_mode: sms
  reconcile_time: "03:00"          # conciliación diaria con Lofty
  weekly_report_day: mon           # reporte semanal a ALERT_WEBHOOK_URL (null = no enviar)
  weekly_report_time: "08:00"

tags:
  spanish: ES
  cma_sent: CMA Sent
  contact_not_owner: Contact Not Owner
  status: {hot: Hot, warm: Warm, follow_up: Follow-up, not_interested: Not Interested, dnc: DNC}

# Plantillas de mensajes (EN / ES).
# Variables: {first_name} {owner_name} {street} {city} {agent_name} {agent_phone} {link}
templates:
  initial:
    en: "Hi {first_name}, this is {agent_name}, a local real estate agent. Would you consider selling {street}, or would a free market analysis help? Reply STOP to opt out."
    es: "Hola {first_name}, soy {agent_name}, agente de bienes raíces local. ¿Consideraría vender {street} o le serviría un análisis de mercado gratis? Responda STOP para no recibir mensajes."
  # Cuando el contacto de Propwire no coincide con ningún dueño (a menudo un inquilino).
  initial_owner_check:
    en: "Hi {first_name}, this is {agent_name}, a local real estate agent. I'm trying to reach the owner of {street}. Is that you? Reply STOP to opt out."
    es: "Hola {first_name}, soy {agent_name}, agente de bienes raíces local. Busco al dueño de {street}. ¿Es usted? Responda STOP para no recibir mensajes."
  follow_up:
    en: "Hi {first_name}, {agent_name} here following up about {street}. Is selling still on your radar? Reply STOP to opt out."
    es: "Hola {first_name}, le saluda {agent_name} sobre {street}. ¿Sigue pensando en vender? Responda STOP para no recibir mensajes."
  cma:
    en: "Hi {first_name}, here is your free market analysis for {street}: {link} Happy to walk you through it. - {agent_name}, {agent_phone}"
    es: "Hola {first_name}, aquí está su análisis de mercado gratis para {street}: {link} Con gusto se lo explico. - {agent_name}, {agent_phone}"
